name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Superseded runs are cancelled, including on main.
# That's safe here specifically because this workflow's artifacts are never consumed: releases are built by the tag-triggered deploy.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/full-build

  # The same build and tests, natively on Arm64.
  build-test-arm64:
    name: Build and test arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: bash
        run: dotnet test -c Release --blame-hang --blame-hang-timeout 5m

  smoke-test:
    name: Smoke test ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact

      - uses: ./.github/actions/smoke-test
        with:
          msi: artifact/SentryDeck-0.0.0-${{ matrix.arch }}.msi
          exe: '%LOCALAPPDATA%\SentryDeck\SentryDeck\SentryDeck.exe'
          logs: '%LOCALAPPDATA%\SentryDeck\logs\*.txt'
